name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scanner and CLI test suite
        run: bash tests/run-tests.sh
      - name: npm package sanity
        run: npm pack --dry-run
