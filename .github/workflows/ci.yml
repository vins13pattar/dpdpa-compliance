name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scanner and CLI test suite
        run: bash tests/run-tests.sh
      - name: npm package sanity
        run: npm pack --dry-run
      - name: Python package build + wheel smoke test
        run: |
          python -m pip install build
          python -m build python/
          python -m pip install python/dist/*.whl
          dpdpa-audit --version
          if dpdpa-audit tests/fixtures/vulnerable-app -o /tmp/wheel-vuln.md --fail-on high; then
            echo "wheel smoke test failed: expected non-zero exit" && exit 1
          fi
