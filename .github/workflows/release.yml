name: Release

# Two ways to cut a release:
#   1. Push a version tag:  git tag v2.1.0 && git push origin v2.1.0
#   2. Run this workflow manually (Actions → Release → Run workflow) with the
#      tag name — the tag is created on the target commit if it doesn't exist.
# Either way it creates the GitHub Release with generated notes, then builds
# the Python package and publishes it to PyPI.
#
# PyPI uses trusted publishing (OIDC) — no token secrets. One-time setup on
# https://pypi.org → your account → Publishing → add a "pending publisher":
#   project: dpdpa-audit, owner: vins13pattar, repo: dpdpa-compliance,
#   workflow: release.yml, environment: pypi
# Until that's configured, the pypi job fails with an OIDC exchange error —
# re-run it after setup.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v2.1.0); created if it does not exist'
        required: true

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi

  pypi:
    needs: github-release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build python/
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          skip-existing: true
