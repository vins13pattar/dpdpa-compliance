name: Release

# Three ways a release is cut:
#   1. Push to main with a bumped version in package.json — the tag
#      v<version> and the GitHub Release are created automatically.
#   2. Push a version tag:  git tag v2.1.0 && git push origin v2.1.0
#   3. Run this workflow manually (Actions → Release → Run workflow) with the
#      tag name — the tag is created on the target commit if it doesn't exist.
# Each path creates the GitHub Release with generated notes, then builds the
# Python package and publishes it to PyPI. Every path is idempotent: if the
# release for the version already exists, the run is a no-op.
#
# PyPI uses trusted publishing (OIDC) — no token secrets. One-time setup on
# https://pypi.org → your account → Publishing → add a "pending publisher":
#   project: dpdpa-audit, owner: vins13pattar, repo: dpdpa-compliance,
#   workflow: release.yml, environment: pypi
# Until that's configured, the pypi job fails with an OIDC exchange error —
# re-run it after setup.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v2.1.0); created if it does not exist'
        required: true

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.release.outputs.created }}
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release (idempotent)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(jq -r .version package.json)"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --target "$GITHUB_SHA"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

  pypi:
    needs: github-release
    if: needs.github-release.outputs.created == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build python/
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          skip-existing: true
